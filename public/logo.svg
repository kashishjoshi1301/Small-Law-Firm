<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold / Terracotta Accents Gradient -->
    <linearGradient id="ataGoldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C7B5" />
      <stop offset="45%" stop-color="#BD967E" />
      <stop offset="100%" stop-color="#966D55" />
    </linearGradient>

    <!-- Deep Pine Primary Gradient -->
    <linearGradient id="ataPineGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4846" />
      <stop offset="60%" stop-color="#153B3A" />
      <stop offset="100%" stop-color="#0E2827" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="ataGlowGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#28605C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#153B3A" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="ataShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="rgba(21, 59, 58, 0.45)"/>
    </filter>
  </defs>

  <!-- Outer Prestige Shield Frame -->
  <path d="M32 3L56 12V32C56 46.5 45.8 56.8 32 61C18.2 56.8 8 46.5 8 32V12L32 3Z" 
        fill="url(#ataPineGrad)" 
        stroke="url(#ataGoldGrad)" 
        stroke-width="2" 
        filter="url(#ataShadow)"/>

  <!-- Inner Inset Shield Lining -->
  <path d="M32 6.5L52 14V31.5C52 44 43.5 53 32 56.8C20.5 53 12 44 12 31.5V14L32 6.5Z" 
        fill="none" 
        stroke="url(#ataGoldGrad)" 
        stroke-width="0.8" 
        stroke-dasharray="2.5 1.5" 
        opacity="0.75"/>

  <!-- Subtle Radial Glow Background -->
  <circle cx="32" cy="28" r="20" fill="url(#ataGlowGrad)" />

  <!-- Classical Court Pediment (Temple Roof) -->
  <path d="M32 12.5L18 20H46L32 12.5Z" fill="url(#ataGoldGrad)" />
  <rect x="17" y="20.5" width="30" height="2" rx="0.5" fill="url(#ataGoldGrad)" />

  <!-- Central Judicial Column Pillar -->
  <rect x="30.6" y="23" width="2.8" height="20" fill="url(#ataGoldGrad)" />
  <!-- Column Fluting Lines -->
  <line x1="32" y1="24" x2="32" y2="42" stroke="#153B3A" stroke-width="0.7" opacity="0.6"/>

  <!-- Column Pedestal Base -->
  <rect x="25" y="43" width="14" height="2.5" rx="0.6" fill="url(#ataGoldGrad)" />
  <rect x="23" y="46" width="18" height="2" rx="0.5" fill="url(#ataGoldGrad)" />

  <!-- Scales of Justice: Horizontal Crossbeam -->
  <path d="M17 26H47" stroke="url(#ataGoldGrad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="32" cy="26" r="2.8" fill="#153B3A" stroke="url(#ataGoldGrad)" stroke-width="1.6" />

  <!-- Left Scale: Strings & Pan -->
  <path d="M19.5 26L14.5 35.5" stroke="url(#ataGoldGrad)" stroke-width="1.2" />
  <path d="M19.5 26L24.5 35.5" stroke="url(#ataGoldGrad)" stroke-width="1.2" />
  <path d="M13.5 35.5C13.5 35.5 14.8 39.5 19.5 39.5C24.2 39.5 25.5 35.5 25.5 35.5H13.5Z" fill="url(#ataGoldGrad)" />

  <!-- Right Scale: Strings & Pan -->
  <path d="M44.5 26L39.5 35.5" stroke="url(#ataGoldGrad)" stroke-width="1.2" />
  <path d="M44.5 26L49.5 35.5" stroke="url(#ataGoldGrad)" stroke-width="1.2" />
  <path d="M38.5 35.5C38.5 35.5 39.8 39.5 44.5 39.5C49.2 39.5 50.5 35.5 50.5 35.5H38.5Z" fill="url(#ataGoldGrad)" />

  <!-- Atlantic Maritime Wave Arch Motif (Representing Atlantic Heritage at Bottom) -->
  <path d="M20 50C24 48.5 27 51 32 49.5C37 48 40 50.5 44 49" 
        stroke="url(#ataGoldGrad)" 
        stroke-width="1.4" 
        stroke-linecap="round" 
        opacity="0.85"/>
  <path d="M23 52.8C26 51.5 29 53 32 52C35 51 38 52.5 41 51.8" 
        stroke="url(#ataGoldGrad)" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.5"/>
</svg>
